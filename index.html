<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta
      name="description"
      content="Fast, offline-capable Pokémon team planner with generation-accurate mechanics, type analysis, smart recommendations, and campaign journey planning."
    />
    <meta property="og:title" content="PokéPlanner — Pokémon Team Planner" />
    <meta
      property="og:description"
      content="Fast, offline-capable Pokémon team planner with generation-accurate mechanics, type analysis, smart recommendations, and campaign journey planning."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/daniyusk/pokeplanner" />
    <title>Pokémon Team Planner</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('pokeplanner:theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
